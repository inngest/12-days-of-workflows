name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # pnpm starters --push updates the starter branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # retry-heavy "-before" scenarios take minutes each
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Update starter branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin starter:starter || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm starters --push
