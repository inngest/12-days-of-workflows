<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ledger wall</title>
<style>
  /* Design tokens: theme the wall here, no JS changes needed. */
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --ink: #1c1b19;
    --muted: #6b6860;
    --line: #e4e1d8;
    --good: #1f7a4d;
    --bad: #b3261e;
    --warn: #a15c00;
    --level-work: #2f6fde;
    --level-scale: #1f8a5b;
    --level-faster: #c48a00;
    --level-profitable: #7b4fd6;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --panel: #1e1d1b;
      --ink: #f2f0ea;
      --muted: #a29e94;
      --line: #34322e;
      --good: #4cc38a;
      --bad: #ff6b5f;
      --warn: #f0a940;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .level { color: #fff; background: var(--level); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
  h1 { font-size: clamp(22px, 3.4vw, 34px); margin: 12px 0 4px; line-height: 1.2; }
  .sub { color: var(--muted); font-size: 14px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 20px 0; }
  button, input { font: inherit; font-size: 16px; border-radius: 10px; border: 1px solid var(--line); padding: 10px 14px; background: var(--panel); color: var(--ink); }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: var(--level); border-color: var(--level); color: #fff; }
  button:active { transform: translateY(1px); }
  input { min-width: min(420px, 100%); }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .big { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .rows { margin-top: 10px; display: grid; gap: 4px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .rows div { display: flex; justify-content: space-between; }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .wide { grid-column: 1 / -1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 13px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .chip.dup { border-color: var(--bad); color: var(--bad); font-weight: 700; }
  .chip.fail { border-style: dashed; color: var(--bad); }
  .chip b { color: var(--muted); font-weight: 400; margin-right: 4px; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <span class="level" id="level"></span>
    <span class="sub" id="app"></span>
  </header>
  <h1 id="title">Ledger wall</h1>
  <div class="sub">Every call to a fake service, live. Same numbers <code>pnpm check</code> asserts.</div>

  <div class="toolbar" id="actions">
    <span class="spacer"></span>
    <span class="sub" id="sent"></span>
    <button type="button" id="reset">Reset</button>
  </div>

  <div class="grid" id="panels"></div>
</main>

<script>
  const LEVELS = [
    { upTo: 3, name: "Make it work", color: "var(--level-work)" },
    { upTo: 6, name: "Make it scale", color: "var(--level-scale)" },
    { upTo: 9, name: "Make it faster", color: "var(--level-faster)" },
    { upTo: 12, name: "Make it profitable", color: "var(--level-profitable)" },
  ];
  let sentCount = 0;

  async function sendEvent(name, data) {
    await fetch("/__event", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, data }),
    });
    sentCount++;
    document.getElementById("sent").textContent = `${sentCount} event${sentCount === 1 ? "" : "s"} sent`;
  }

  function renderActions(actions) {
    const bar = document.getElementById("actions");
    for (const action of [...actions].reverse()) {
      if (action.kind === "button") {
        const button = document.createElement("button");
        button.className = "primary";
        button.textContent = action.label;
        button.onclick = () => sendEvent(action.event, action.data);
        bar.prepend(button);
      } else {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.placeholder = "Start typing…";
        input.oninput = () => sendEvent(action.event, { ...action.data, [action.field]: input.value });
        label.append(action.label, input);
        bar.prepend(label);
      }
    }
  }

  async function loadConfig() {
    const config = await (await fetch("/__wall")).json();
    const day = Number(config.appId.replace(/\D/g, "")) || 0;
    const level = LEVELS.find((l) => day <= l.upTo) ?? LEVELS[0];
    document.documentElement.style.setProperty("--level", level.color);
    document.getElementById("level").textContent = level.name;
    document.getElementById("app").textContent = config.appId;
    document.getElementById("title").textContent = config.title;
    document.title = config.title;
    renderActions(config.actions);
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const row = (label, value, cls = "") => `<div><span>${label}</span><span class="${cls}">${value}</span></div>`;
  const panel = (title, big, rows, cls = "") =>
    `<section class="panel ${cls}"><h2>${title}</h2><div class="big">${big}</div><div class="rows">${rows.join("")}</div></section>`;

  function render(ledger) {
    const by = (provider, op) => ledger.filter((e) => e.provider === provider && (!op || e.op === op));
    const html = [];

    const llm = by("llm", "writeCard");
    if (llm.length) {
      const billed = llm.filter((e) => e.ok).reduce((sum, e) => sum + (e.costUsd ?? 0), 0);
      const cards = new Set(llm.map((e) => e.cardId)).size;
      html.push(panel("LLM calls", llm.length, [
        row("Billed", `$${billed.toFixed(3)}`),
        row("Cards", cards),
        row("Calls per card", (llm.length / Math.max(cards, 1)).toFixed(1), llm.length > cards ? "warn" : ""),
      ]));
    }

    const image = by("image", "renderImage");
    if (image.length) {
      const limited = image.filter((e) => !e.ok && e.meta?.status === 429).length;
      const failed = image.filter((e) => !e.ok).length - limited;
      html.push(panel("Image renders", image.length, [
        row("Rendered", image.filter((e) => e.ok).length, "good"),
        row("Rate limited (429)", limited, limited ? "bad" : ""),
        row("Failed", failed, failed ? "bad" : ""),
      ]));
    }

    const mail = by("mail", "sendCard");
    const notices = by("mail", "notifySender");
    if (mail.length || notices.length) {
      const delivered = mail.filter((e) => e.ok);
      const perRecipient = new Map();
      for (const e of delivered) perRecipient.set(e.meta?.to, (perRecipient.get(e.meta?.to) ?? 0) + 1);
      const duplicates = [...perRecipient.values()].filter((n) => n > 1).length;
      html.push(panel("Deliveries", delivered.length, [
        row("Failed attempts", mail.length - delivered.length, mail.length > delivered.length ? "bad" : ""),
        row("Got it twice", duplicates, duplicates ? "bad" : ""),
        ...(notices.length ? [row("Sender notified", notices.length, "warn")] : []),
      ]));

      // One card to many people (Day 09): label chips by recipient, otherwise by card.
      const oneCard = new Set(mail.map((e) => e.cardId)).size === 1 && perRecipient.size > 1;
      const seen = new Map();
      const chips = mail.map((e, i) => {
        const who = oneCard ? String(e.meta?.to).split("@")[0] : e.cardId;
        if (!e.ok) return `<span class="chip fail">✕ ${esc(who)}</span>`;
        const n = (seen.get(e.meta?.to) ?? 0) + 1;
        seen.set(e.meta?.to, n);
        return `<span class="chip ${n > 1 ? "dup" : ""}"><b>${i + 1}</b>${esc(who)}</span>`;
      });
      html.push(`<section class="panel wide"><h2>Delivery order</h2><div class="chips">${chips.join("")}</div></section>`);
    }

    const writes = by("warehouse", "insertRows");
    if (writes.length) {
      const rows = writes.reduce((sum, e) => sum + Number(e.meta?.rows ?? 0), 0);
      html.push(panel("Warehouse writes", writes.length, [
        row("Rows inserted", rows),
        row("Rows per write", (rows / writes.length).toFixed(1)),
      ]));
    }

    document.getElementById("panels").innerHTML =
      html.join("") || `<div class="empty wide">Nothing yet. Run <code>pnpm send …</code> or use the buttons above.</div>`;
  }

  async function poll() {
    try {
      render(await (await fetch("/__ledger")).json());
    } catch {}
    setTimeout(poll, 500);
  }

  document.getElementById("reset").onclick = async () => {
    await fetch("/__ledger", { method: "DELETE" });
    sentCount = 0;
    document.getElementById("sent").textContent = "";
  };

  loadConfig();
  poll();
</script>
</body>
</html>
