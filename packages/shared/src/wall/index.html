<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hearth Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@500..800&display=swap" />
<!-- Hearth Post tokens and components, from the design system (see wall/hearth.css). -->
<link rel="stylesheet" href="/wall.css" />
<style>
  /* Page layout only: every color, size and shape comes from the Hearth Post tokens. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 400 22px/32px var(--font-sans); }
  .wall { max-width: 1840px; margin: 0 auto; padding: var(--space-6); display: grid; gap: var(--space-5); }
  .wall__bar { display: flex; flex-wrap: wrap; align-items: end; gap: var(--space-4) var(--space-5); }
  .wall__bar .hp-field { flex: 0 1 460px; }
  .wall__spacer { flex: 1; }
  .wall__sent { font: 500 18px/24px var(--font-sans); color: var(--muted); align-self: center; }
  .wall__split { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
  .wall__stack { display: grid; gap: var(--space-5); min-width: 0; }
  .wall__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--space-5); }
  .wall__empty { padding: var(--space-7) var(--space-5); text-align: center; color: var(--muted); }
  .wall__empty code { display: inline-block; margin-top: var(--space-2); padding: var(--space-1) var(--space-3); border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--ink); font: 500 20px/28px var(--font-mono); }
  .wall__chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .hp-slot[data-me] { width: auto; min-width: 48px; padding: 0 8px; border: 2px solid var(--brand); background: var(--brand); color: var(--on-brand); font-size: 18px; }
  .hp-slot[data-me]::before { content: "b1"; }
  .hp-lane__slots { min-width: 0; }
  .hp-calls__grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: var(--space-3); }
  .hp-call { font-size: 34px; gap: var(--space-1); }
  .hp-call small { font-size: 18px; }
  .hp-ba__col { min-height: 0; }
  .hp-stat__unit { white-space: nowrap; }
  .hp-cost--many .hp-tick { min-width: 0; padding: 6px 8px; font-size: 14px; }
  .hp-call--wide small { margin-left: var(--space-3); }
  .hp-seg button { white-space: nowrap; }
  .hp-q__name b { font-weight: 800; }
  @media (max-width: 900px) {
    .wall { padding: var(--space-4); }
    .wall__split { grid-template-columns: 1fr; }
    .hp-seg button { padding: 8px 14px; }
    .hp-card { max-width: 340px; }
    .hp-cost__total, .hp-stat__value { font-size: 72px; }
    .hp-stat--xl .hp-stat__value { font-size: 120px; line-height: 116px; }
  }
</style>
</head>
<body>
<main class="wall">
  <header class="hp-day hp-lv-work" id="day"></header>

  <div class="wall__bar" id="bar">
    <div class="hp-seg" id="sides"></div>
    <span class="wall__spacer"></span>
    <span class="wall__sent" id="sent"></span>
    <button type="button" class="hp-btn hp-btn--secondary" id="reset">Reset</button>
  </div>

  <div class="hp-ba" id="stage"></div>
</main>

<script>
  const LEVELS = [
    { upTo: 3, name: "Make it work", cls: "hp-lv-work" },
    { upTo: 6, name: "Make it scale", cls: "hp-lv-scale" },
    { upTo: 9, name: "Make it faster", cls: "hp-lv-faster" },
    { upTo: 12, name: "Make it profitable", cls: "hp-lv-profitable" },
  ];

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const usd = (n) => `$${n.toFixed(3)}`;
  const isBefore = (e) => String(e.fn ?? "").endsWith("-before");
  const where = (E, provider, op) => E.filter((e) => e.provider === provider && (!op || e.op === op));
  const badge = (tone, state, label, extra = "") =>
    `<span class="hp-badge ${extra}" data-tone="${tone}" data-state="${state}">${esc(label)}</span>`;
  const stat = ({ label, value, unit = "", note = "", tone = "", size = "" }) =>
    `<div class="hp-stat ${size}" ${tone ? `data-tone="${tone}"` : ""}><span class="hp-stat__label">${esc(label)}</span>` +
    `<span class="hp-stat__value">${value}${unit ? `<span class="hp-stat__unit">${esc(unit)}</span>` : ""}</span>` +
    `${note ? `<p class="hp-stat__note">${note}</p>` : ""}</div>`;
  const empty = (command) =>
    `<div class="wall__empty">Nothing here yet.<br />${command ? `Run <code>${esc(command)}</code>` : "Use the buttons above."}</div>`;

  // ---- Day 01: the same card text, billed again on every retry ----
  function day01(E, side, other) {
    const llm = where(E, "llm", "writeCard").filter((e) => e.ok);
    if (!llm.length) return null;
    const image = where(E, "image", "renderImage");
    const mailOk = where(E, "mail", "sendCard").some((e) => e.ok);
    const imageOk = image.some((e) => e.ok);
    const failedCalls = image.filter((e) => !e.ok).length;
    const bills = llm.length;
    const unit = llm[0].costUsd ?? 0;
    const total = llm.reduce((sum, e) => sum + (e.costUsd ?? 0), 0);
    const fixed = side === "after";
    const tone = bills > 1 ? "danger" : fixed ? "good" : "warn";
    const otherBills = where(other, "llm", "writeCard").filter((e) => e.ok).length;

    const ticks = llm.map((e, i) => `<span class="hp-tick" ${i === 0 ? (tone === "good" ? "data-good" : "") : "data-extra"}>${usd(e.costUsd ?? 0)}</span>`);
    const saved = fixed ? Array.from({ length: failedCalls }, () => `<span class="hp-tick" data-saved>${usd(unit)}</span>`) : [];

    const art = imageOk ? `<div class="hp-card__art"><i class="hp-tree"></i></div>`
      : failedCalls ? `<div class="hp-card__art" data-art="failed"><div class="hp-card__artnote">Artwork failed<small>Try ${image.length}, still trying</small></div></div>`
      : `<div class="hp-card__art" data-art="painting"><div class="hp-card__artnote">Painting…</div></div>`;
    const foot = mailOk ? badge("good", "sent", "Sent")
      : failedCalls && !imageOk ? badge("warn", "retrying", `Retrying, try ${image.length + 1}`, "") .replace("<span", "<span data-live")
      : badge("neutral", "painting", "Painting").replace("<span", "<span data-live");
    const to = where(E, "mail", "sendCard")[0]?.meta?.to ?? "grandma@example.com";
    const card =
      `<article class="hp-card">${mailOk ? `<span class="hp-card__stamp">Sent</span>` : ""}${art}` +
      `<div class="hp-card__body"><p class="hp-card__msg">${esc(llm[0].meta?.prompt ?? "")}</p><p class="hp-card__to">To <b>${esc(to)}</b></p></div>` +
      `<div class="hp-card__foot">${foot}</div></article>`;

    const note = !fixed ? `should be <b>1×</b>` : otherBills > 1 ? `was <b>${otherBills}×</b> before the fix` : `retries reused the saved text`;
    const meter =
      `<div class="hp-cost" data-tone="${tone}"><div class="hp-cost__head">` +
      `<div class="hp-stat"><span class="hp-stat__label">Message billed</span><span class="hp-cost__total">${usd(total)}</span></div>` +
      `<span class="hp-chip" data-tone="${tone}">Billed ${bills}×</span></div>` +
      `<div class="hp-cost__ticks">${[...ticks, ...saved].join("")}</div>` +
      `<div class="hp-cost__bar" aria-hidden="true"><i style="--pct:${Math.min(100, (total / Math.max(unit * 3, 0.0001)) * 100)}%"></i></div>` +
      `<div class="hp-cost__foot">${!fixed ? `<span>Same card text, <b>bought ${bills} time${bills === 1 ? "" : "s"}</b></span><span>should be ${usd(unit)}</span>` : `<span>Retries reused the saved text</span><span><b>${usd(unit * failedCalls)} saved</b></span>`}</div></div>`;
    const hero = stat({ label: "LLM billed", value: `${bills}×`, unit: "for the same text", note, tone, size: "hp-stat--xl" });
    return {
      body: `<div class="wall__split">${card}<div class="wall__stack">${hero}${meter}</div></div>`,
      verdict: !fixed ? `Paid ${usd(total)} for one card` : `Paid ${usd(total)} for one card, once`,
    };
  }

  // ---- Day 06: where does the second customer's card land? ----
  function day06(E, side) {
    if (!E.length) return null;
    const mails = where(E, "mail", "sendCard").filter((e) => e.ok).map((e) => e.cardId);
    const started = new Set(E.map((e) => e.cardId));
    const total = 21;
    const pos = mails.indexOf("b1") + 1;
    const aDone = mails.filter((id) => id.startsWith("a")).length;
    const bStarted = started.has("b1");
    const slow = pos > 10;
    const tone = pos ? (slow ? "danger" : "good") : "warn";

    const hero = stat({
      label: "Maisie's queue spot",
      value: pos ? `#${pos}` : "—",
      note: pos ? `of ${total} cards delivered` : bStarted ? "running now" : `waiting behind <b>${20 - aDone}</b> cards`,
      tone,
      size: "hp-stat--xl",
    });

    const maisieBadge = pos ? badge(slow ? "danger" : "good", "sent", `Delivered #${pos}`)
      : bStarted ? badge("neutral", "painting", "Running now", "").replace("<span", "<span data-live")
      : badge("warn", "waiting", `Waiting behind ${20 - aDone}`);
    const rows =
      `<ul class="hp-queue">` +
      `<li class="hp-q" data-group ${aDone < 20 ? "data-running" : ""}><span class="hp-q__pos">${aDone < 20 ? 20 - aDone : "✓"}</span><span class="hp-q__avatar">N</span>` +
      `<div><p class="hp-q__name">Northpole Co. ×20</p><p class="hp-q__sub">account a · ${aDone} delivered</p></div>` +
      `${aDone < 20 ? badge("neutral", "queued", "Sending", "hp-badge--sm") : badge("good", "sent", "All sent", "hp-badge--sm")}</li>` +
      `<li class="hp-q" ${!pos && !bStarted ? "data-you" : ""} ${bStarted && !pos ? "data-running" : ""}><span class="hp-q__pos">${pos ? `#${pos}` : "b1"}</span><span class="hp-q__avatar">M</span>` +
      `<div><p class="hp-q__name">Maisie</p><p class="hp-q__sub">account b · one card</p></div>${maisieBadge}</li></ul>`;

    const slot = (s, me = "") => `<span class="hp-slot" ${s ? `data-s="${s}"` : ""} ${me}></span>`;
    const order = Array.from({ length: total }, (_, i) => (i < mails.length ? (mails[i] === "b1" ? slot("run", "data-me") : slot("done")) : slot("")));
    const aLane = Array.from({ length: 20 }, (_, i) => {
      const id = `a${i + 1}`;
      return slot(mails.includes(id) ? "done" : started.has(id) ? "run" : "");
    });
    const lanes =
      `<div class="hp-lanes">` +
      `<div class="hp-lane"><div><p class="hp-lane__name">Delivery order</p><p class="hp-lane__sub">first to last</p></div><div class="hp-lane__slots">${order.join("")}</div></div>` +
      `<div class="hp-lane"><div><p class="hp-lane__name">Northpole Co.</p><p class="hp-lane__sub">account a</p></div><div class="hp-lane__slots">${aLane.join("")}</div></div>` +
      `<div class="hp-lane"><div><p class="hp-lane__name">Maisie</p><p class="hp-lane__sub">account b</p></div><div class="hp-lane__slots">${slot(pos ? "done" : bStarted ? "run" : "")}</div></div></div>`;

    return {
      body: `<div class="wall__stack">${hero}${rows}${lanes}</div>`,
      verdict: pos ? `Maisie's card went out #${pos} of ${total}` : `Maisie's card is waiting in line`,
    };
  }

  // ---- Day 07: a wall of 429s, or none ----
  function day07(E, side) {
    const image = where(E, "image", "renderImage");
    if (!image.length) return null;
    const failedBefore = new Set();
    const tiles = image.map((e) => {
      if (!e.ok) {
        failedBefore.add(e.cardId);
        const status = e.meta?.status ?? 500;
        return `<div class="hp-call" data-tone="danger">${status === 429 ? "429" : "✕"}<small>${esc(e.cardId ?? "")}</small></div>`;
      }
      return failedBefore.has(e.cardId)
        ? `<div class="hp-call" data-tone="warn">↻<small>${esc(e.cardId ?? "")}</small></div>`
        : `<div class="hp-call" data-tone="good">✓<small>${esc(e.cardId ?? "")}</small></div>`;
    });
    const limited = image.filter((e) => !e.ok && e.meta?.status === 429).length;
    const rendered = image.filter((e) => e.ok).length;
    const cards = new Set(image.map((e) => e.cardId)).size;
    const tone = limited ? "danger" : "good";
    const head =
      stat({ label: "Rate limited", value: limited, note: limited ? "renders refused with a 429" : "no render refused", tone, size: "hp-stat--xl" }) +
      stat({ label: "Rendered", value: rendered, note: `of <b>${cards}</b> cards`, tone: "good" }) +
      stat({ label: "Calls made", value: image.length, note: "to the image service" });
    return {
      body: `<div class="hp-calls"><div class="hp-calls__head">${head}</div><div class="hp-calls__grid">${tiles.join("")}</div></div>`,
      verdict: limited ? `${limited} of ${image.length} calls were refused` : `All ${rendered} renders accepted first time`,
    };
  }

  // ---- Shared pieces for the next five days ----
  const live = (html) => html.replace("<span", "<span data-live");
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
  const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;
  const timeline = (items) =>
    `<ol class="hp-tl">${items
      .map(
        (i) =>
          `<li class="hp-tl__item" data-state="${i.state}" data-tone="${i.tone}"><span class="hp-tl__node"></span>` +
          `<div><p class="hp-tl__title">${esc(i.title)}</p><p class="hp-tl__meta">${esc(i.meta ?? "")}</p></div>` +
          `<div class="hp-tl__side">${i.chip ? `<span class="hp-chip" data-tone="${i.tone}">${esc(i.chip)}</span>` : ""}</div></li>`,
      )
      .join("")}</ol>`;
  const alertBox = (tone, title, text, toast = false) =>
    `<div class="hp-alert ${toast ? "hp-toast" : ""}" data-tone="${tone}" role="${tone === "danger" ? "alert" : "status"}"><span class="hp-alert__icon"></span>` +
    `<div><p class="hp-alert__title">${esc(title)}</p><p class="hp-alert__text">${esc(text)}</p></div></div>`;
  // One greeting card. art: "tree" | "painting" | "failed" (the last two take an art note).
  const cardView = ({ art = "tree", note = "", msg = "", to = "", stamp = "", stampTone = "", foot = "" }) =>
    `<article class="hp-card">${stamp ? `<span class="hp-card__stamp" ${stampTone ? `data-tone="${stampTone}"` : ""}>${esc(stamp)}</span>` : ""}` +
    (art === "tree" ? `<div class="hp-card__art"><i class="hp-tree"></i></div>` : `<div class="hp-card__art" data-art="${art}"><div class="hp-card__artnote">${note}</div></div>`) +
    `<div class="hp-card__body">${msg ? `<p class="hp-card__msg">${esc(msg)}</p>` : `<div class="hp-card__line"></div><div class="hp-card__line"></div><div class="hp-card__line"></div>`}` +
    `${to ? `<p class="hp-card__to">${to}</p>` : ""}</div><div class="hp-card__foot">${foot}</div></article>`;

  // ---- The card's journey, shared by Days 02 and 03: written, painted, delivered ----
  // A step that runs with the default 4 retries has had 5 tries when it gives up.
  const DEFAULT_TRIES = 5;
  function journey(E, { gaveUpAfter = Infinity } = {}) {
    const llm = where(E, "llm", "writeCard");
    const image = where(E, "image", "renderImage");
    const mailOk = where(E, "mail", "sendCard").some((e) => e.ok);
    const written = llm.some((e) => e.ok);
    const painted = image.some((e) => e.ok);
    const tries = image.length;
    const gaveUp = !painted && tries >= gaveUpAfter;
    const writeTries = llm.length;
    const to = where(E, "mail", "sendCard")[0]?.meta?.to ?? "grandma@example.com";
    const prompt = llm.find((e) => e.meta?.prompt)?.meta.prompt ?? "";
    return { llm, image, mailOk, written, painted, tries, gaveUp, writeTries, to, prompt };
  }
  function journeyCard(j) {
    const art = j.painted ? { art: "tree" }
      : j.gaveUp ? { art: "failed", note: `Artwork failed<small>Gave up after ${j.tries} tries</small>` }
      : { art: "painting", note: `Painting…<small>${j.tries ? `Try ${j.tries + 1}, still trying` : "Try 1"}</small>` };
    const foot = j.mailOk ? badge("good", "sent", "Sent")
      : j.gaveUp ? badge("danger", "failed", "Not delivered")
      : j.tries ? live(badge("warn", "retrying", `Retrying, try ${j.tries + 1}`))
      : j.written ? live(badge("neutral", "painting", "Painting"))
      : live(badge("neutral", "writing", "Writing"));
    return cardView({ ...art, msg: j.prompt, to: `To <b>${esc(j.to)}</b>`, stamp: j.mailOk ? "Sent" : j.gaveUp ? "Not sent" : "", stampTone: j.gaveUp ? "danger" : "", foot });
  }
  function journeySteps(j, { checked = false } = {}) {
    const steps = [];
    if (checked) steps.push({ state: "done", tone: "good", title: "Prompt checked", meta: "Moderation said yes" });
    const writeChip = j.writeTries > 1 ? `↻ ${j.writeTries}` : "";
    steps.push(
      j.written ? { state: "done", tone: "good", title: "Message written", meta: j.writeTries > 1 ? `Worked on try ${j.writeTries}` : "One call", chip: writeChip }
      : j.writeTries ? { state: "retrying", tone: "warn", title: "Writing the message", meta: `Try ${j.writeTries + 1} · LLM said 429`, chip: `↻ ${j.writeTries}` }
      : { state: "active", tone: "neutral", title: "Writing the message", meta: "Working…" },
    );
    steps.push(
      j.painted ? { state: "done", tone: "good", title: "Artwork painted", meta: `Worked on try ${j.tries}`, chip: j.tries > 1 ? `↻ ${j.tries}` : "" }
      : j.gaveUp ? { state: "failed", tone: "danger", title: "Gave up on the artwork", meta: `After ${j.tries} tries · no card sent`, chip: `↻ ${j.tries}` }
      : j.tries ? { state: "retrying", tone: "warn", title: "Painting the artwork", meta: `Try ${j.tries + 1} · service busy`, chip: `↻ ${j.tries}` }
      : { state: j.written ? "active" : "pending", tone: "neutral", title: "Painting the artwork", meta: j.written ? "Try 1" : "Not yet" },
    );
    steps.push(
      j.mailOk ? { state: "done", tone: "good", title: `Delivered to ${j.to}`, meta: "Card sent" }
      : { state: j.gaveUp ? "skipped" : "pending", tone: "neutral", title: "Delivered", meta: j.gaveUp ? "Skipped, the card never got painted" : "Not yet" },
    );
    return steps;
  }

  // ---- Day 02: a hopeless card, and a retry that waits exactly as told ----
  function day02(E) {
    if (!E.length) return null;
    const notices = where(E, "mail", "notifySender");
    const rejected = notices.length > 0;
    const j = journey(E);
    const llmCalls = j.llm.length;

    let main;
    if (rejected) {
      const cardId = notices[0].cardId ?? "c1";
      const reason = String(notices[0].meta?.reason ?? "");
      const card = cardView({
        art: "failed",
        note: "Rejected<small>No artwork painted</small>",
        to: `Card <b>${esc(cardId)}</b>`,
        stamp: "Rejected",
        stampTone: "danger",
        foot: badge("danger", "rejected", "Rejected"),
      });
      const hero = stat({ label: "LLM calls", value: llmCalls, note: llmCalls ? "billed" : "nothing billed, nothing painted", tone: "good", size: "hp-stat--xl" });
      const steps = timeline([
        { state: "failed", tone: "danger", title: "Prompt rejected", meta: reason || "Moderation said no", chip: "No retries" },
        { state: "done", tone: "good", title: "Sender notified", meta: `Email about card ${cardId}` },
        { state: "skipped", tone: "neutral", title: "Message and artwork", meta: "Skipped, nothing to bill" },
      ]);
      main = `<div class="wall__split">${card}<div class="wall__stack">${hero}${steps}${alertBox("good", "Sender notified", `Email sent about card ${cardId}: ${reason}`, true)}</div></div>`;
    } else {
      main = `<div class="wall__split">${journeyCard(j)}<div class="wall__stack">${timeline(journeySteps(j, { checked: j.written }))}</div></div>`;
    }

    // The 429 beat: one failure, then the retry lands when the provider said it would.
    const failed = j.llm.filter((e) => !e.ok);
    let side = "";
    if (failed.length) {
      const next = j.llm.find((e) => e.at > failed[0].at);
      const gap = next ? next.at - failed[0].at : Date.now() - failed[0].at;
      side =
        `<div class="hp-stat hp-stat--panel" data-tone="warn"><span class="hp-stat__label">LLM said 429, retry after 5 s</span>` +
        `<span class="hp-stat__value">${secs(gap)}</span>` +
        `<p class="hp-stat__note">${next ? `${plural(failed.length, "failure")}, then the retry came <b>${secs(gap)}</b> later` : `${plural(failed.length, "failure")}, waiting to retry…`}</p></div>`;
    }
    return {
      body: `<div class="wall__stack">${main}${side}</div>`,
      verdict: rejected ? "Rejected at once, sender notified" : j.mailOk ? `Delivered${failed.length ? ` after ${plural(failed.length, "retry")}` : ""}` : "Card in progress",
    };
  }

  // ---- Day 03: the image step gives up, or its own function keeps going ----
  function day03(E, side) {
    const j = journey(E, { gaveUpAfter: DEFAULT_TRIES });
    if (!j.llm.length && !j.image.length) return null;
    const fixed = side === "after";
    const tone = j.gaveUp ? "danger" : j.painted ? "good" : "warn";
    const hero = stat({
      label: "Painting tries",
      value: j.tries,
      note: j.gaveUp ? `gave up, <b>never delivered</b>` : j.painted ? `worked on try <b>${j.tries}</b>, card delivered` : "service still failing",
      tone,
      size: "hp-stat--xl",
    });
    return {
      body: `<div class="wall__split">${journeyCard(j)}<div class="wall__stack">${hero}${timeline(journeySteps(j))}</div></div>`,
      verdict: j.gaveUp ? `Gave up after ${j.tries} tries, nothing delivered` : j.mailOk ? `Delivered on try ${j.tries}` : fixed ? `Still retrying, try ${j.tries + 1}` : `Still trying, try ${j.tries + 1}`,
    };
  }

  // ---- Day 08: one bill per keystroke, or one for the final text ----
  function day08(E, side) {
    const fixed = side === "after";
    const llm = where(E, "llm", "writeCard").filter((e) => e.ok);
    const typed = state.edits[side];
    const waiting = typed.n > llm.length && Date.now() - typed.at < 15000 && !(fixed && llm.length && llm.at(-1).at > typed.at);
    if (!llm.length && !typed.n) return null;
    const unit = llm[0]?.costUsd ?? 0;
    const total = llm.reduce((sum, e) => sum + (e.costUsd ?? 0), 0);
    const calls = llm.length;
    const tone = !fixed && calls > 1 ? "danger" : fixed && calls ? "good" : "warn";
    const skipped = fixed ? Math.max(typed.n - calls, 0) : 0;
    const ticks = llm.map((e, i) => `<span class="hp-tick" ${i === 0 ? (fixed ? "data-good" : "") : "data-extra"}>${usd(e.costUsd ?? 0)}</span>`);
    const saved = Array.from({ length: skipped }, () => `<span class="hp-tick" data-saved>${usd(unit)}</span>`);
    const latest = llm.at(-1)?.meta?.prompt ?? "";
    const foot = fixed
      ? waiting ? live(badge("warn", "waiting", "Waiting for quiet")) : calls ? badge("good", "sent", "Preview ready") : live(badge("neutral", "writing", "Writing"))
      : calls ? badge(calls > 1 ? "danger" : "good", calls > 1 ? "duplicate" : "sent", `Rewritten ${calls}×`) : live(badge("neutral", "writing", "Writing"));
    const card = cardView({ art: "tree", msg: latest, to: "Preview for <b>c1</b>", foot });
    const hero = stat({
      label: "LLM calls",
      value: calls,
      unit: "for this text",
      note: fixed ? (waiting ? `waiting for <b>3 quiet seconds</b>` : calls ? `one call, <b>after the last edit</b>` : "nothing sent yet") : calls > 1 ? `one per edit, should be <b>1</b>` : "one so far",
      tone,
      size: "hp-stat--xl",
    });
    const meter =
      `<div class="hp-cost" data-tone="${tone}"><div class="hp-cost__head">` +
      `<div class="hp-stat"><span class="hp-stat__label">Preview billed</span><span class="hp-cost__total">${usd(total)}</span></div>` +
      `<span class="hp-chip" data-tone="${tone}">${plural(calls, "call")}</span></div>` +
      `<div class="hp-cost__ticks">${[...ticks, ...saved].join("") || `<span class="hp-tick" data-saved>—</span>`}</div>` +
      `<div class="hp-cost__bar" aria-hidden="true"><i style="--pct:${Math.min(100, calls * 12.5)}%"></i></div>` +
      `<div class="hp-cost__foot">${fixed ? `<span>Only the final text was written</span><span><b>${skipped ? `${usd(unit * skipped)} saved` : "no repeat bills"}</b></span>` : `<span>Every edit <b>started its own run</b></span><span>${usd(unit)} each</span>`}</div></div>`;
    return {
      body: `<div class="wall__split">${card}<div class="wall__stack">${hero}${meter}</div></div>`,
      verdict: fixed ? (calls ? `One preview for the final text, ${usd(total)}` : "Waiting for you to stop typing") : `${plural(calls, "bill")} for one card message, ${usd(total)}`,
    };
  }

  // ---- Day 09: one failure re-sends to everyone, or only to the one who failed ----
  function day09(E, side) {
    const mail = where(E, "mail", "sendCard");
    if (!mail.length) return null;
    const people = new Map();
    for (const e of mail) {
      const p = people.get(e.meta?.to) ?? { ok: 0, fail: 0 };
      e.ok ? p.ok++ : p.fail++;
      people.set(e.meta?.to, p);
    }
    const label = (to) => `#${String(to).replace(/^friend/, "").split("@")[0]}`;
    const tiles = [...people].map(([to, p]) =>
      p.ok > 1 ? `<div class="hp-call" data-tone="danger">×${p.ok}<small>${esc(label(to))}</small></div>`
      : p.ok && p.fail ? `<div class="hp-call" data-tone="warn">↻<small>${esc(label(to))}</small></div>`
      : p.ok ? `<div class="hp-call" data-tone="good">✓<small>${esc(label(to))}</small></div>`
      : `<div class="hp-call" data-tone="danger">✕<small>${esc(label(to))}</small></div>`,
    );
    const twice = [...people.values()].filter((p) => p.ok > 1).length;
    const delivered = [...people.values()].filter((p) => p.ok).length;
    const retried = [...people.values()].filter((p) => p.ok && p.fail).length;
    const failedAttempts = mail.filter((e) => !e.ok).length;
    const head =
      stat({ label: "Got it twice", value: twice, note: twice ? "duplicate deliveries" : "nobody got a repeat", tone: twice ? "danger" : "good", size: "hp-stat--xl" }) +
      stat({ label: "Delivered", value: delivered, note: `of <b>50</b> people`, tone: "good" }) +
      stat({ label: "Retried", value: retried, note: failedAttempts ? `${plural(failedAttempts, "failed attempt")}, then delivered` : "no failed attempts", tone: retried ? "warn" : "" }) +
      stat({ label: "Sends made", value: mail.length, note: "to the mail service" });
    return {
      body: `<div class="hp-calls"><div class="hp-calls__head">${head}</div><div class="hp-calls__grid">${tiles.join("")}</div></div>`,
      verdict: twice ? `${twice} people got the card twice` : delivered >= 50 ? `All ${delivered} delivered once${retried ? `, ${retried} retried` : ""}` : `${delivered} delivered so far, none twice`,
    };
  }

  // ---- Day 11: 120 billed writes, or three ----
  const WRITE_USD = 0.002; // what the on-camera warehouse bills per write
  function day11(E, side) {
    const writes = where(E, "warehouse", "insertRows");
    if (!writes.length) return null;
    const fixed = side === "after";
    const rows = writes.reduce((sum, e) => sum + Number(e.meta?.rows ?? 0), 0);
    const total = writes.length * WRITE_USD;
    const tone = writes.length > 10 ? "danger" : "good";
    const ticks = writes.map(() => `<span class="hp-tick" ${fixed ? "data-good" : ""}>${usd(WRITE_USD)}</span>`);
    const hero = stat({ label: "Warehouse writes", value: writes.length, unit: "billed", note: `${plural(rows, "row")} in ${plural(writes.length, "write")}`, tone, size: "hp-stat--xl" });
    const meter =
      `<div class="hp-cost hp-cost--many" data-tone="${tone}"><div class="hp-cost__head">` +
      `<div class="hp-stat"><span class="hp-stat__label">Warehouse bill</span><span class="hp-cost__total">${usd(total)}</span></div>` +
      `<span class="hp-chip" data-tone="${tone}">${plural(writes.length, "write")}</span></div>` +
      `<div class="hp-cost__ticks">${ticks.join("")}</div>` +
      `<div class="hp-cost__bar" aria-hidden="true"><i style="--pct:${Math.min(100, (writes.length / 120) * 100)}%"></i></div>` +
      `<div class="hp-cost__foot"><span>${usd(WRITE_USD)} per write, however many rows</span>${fixed && rows > writes.length ? `<span><b>${usd((rows - writes.length) * WRITE_USD)} saved</b></span>` : ""}</div></div>`;
    const batches = fixed
      ? `<div class="hp-calls"><div class="hp-calls__grid">${writes
          .map((e) => `<div class="hp-call hp-call--wide" data-tone="good">×${esc(e.meta?.rows)}<small>${plural(Number(e.meta?.rows), "row")}</small></div>`)
          .join("")}</div></div>`
      : "";
    return {
      body: `<div class="wall__stack">${hero}${batches}${meter}</div>`,
      verdict: fixed ? `${plural(rows, "row")} in ${plural(writes.length, "write")}, ${usd(total)}` : `${plural(writes.length, "write")} for ${plural(rows, "row")}, ${usd(total)}`,
    };
  }

  // ---- Every other day: the ledger as Hearth Post panels ----
  function generic(E) {
    if (!E.length) return null;
    const panels = [];
    const panel = (label, value, notes, tone = "") =>
      panels.push(`<div class="hp-stat hp-stat--panel" ${tone ? `data-tone="${tone}"` : ""}><span class="hp-stat__label">${label}</span><span class="hp-stat__value">${value}</span><p class="hp-stat__note">${notes.join("<br />")}</p></div>`);

    const llm = where(E, "llm", "writeCard");
    if (llm.length) {
      const billed = llm.filter((e) => e.ok).reduce((sum, e) => sum + (e.costUsd ?? 0), 0);
      const cards = new Set(llm.map((e) => e.cardId)).size;
      panel("LLM calls", llm.length, [`${usd(billed)} billed`, `${(llm.length / Math.max(cards, 1)).toFixed(1)} calls per card`], llm.length > cards ? "danger" : "");
    }
    const image = where(E, "image", "renderImage");
    if (image.length) {
      const limited = image.filter((e) => !e.ok && e.meta?.status === 429).length;
      const failed = image.filter((e) => !e.ok).length - limited;
      panel("Image renders", image.filter((e) => e.ok).length, [`${limited ? "✕ " : ""}${limited} rate limited (429)`, `${failed ? "✕ " : ""}${failed} failed`], limited || failed ? "danger" : "good");
    }
    const mail = where(E, "mail", "sendCard");
    const notices = where(E, "mail", "notifySender");
    const delivered = mail.filter((e) => e.ok);
    const perRecipient = new Map();
    for (const e of delivered) perRecipient.set(e.meta?.to, (perRecipient.get(e.meta?.to) ?? 0) + 1);
    const duplicates = [...perRecipient.values()].filter((n) => n > 1).length;
    if (mail.length || notices.length) {
      const notes = [`${mail.length > delivered.length ? "✕ " : ""}${mail.length - delivered.length} failed attempts`, `${duplicates} got it twice`];
      if (notices.length) notes.push(`${notices.length} sender notified`);
      panel("Cards sent", delivered.length, notes, duplicates ? "danger" : "");
    }
    const writes = where(E, "warehouse", "insertRows");
    if (writes.length) {
      const rows = writes.reduce((sum, e) => sum + Number(e.meta?.rows ?? 0), 0);
      panel("Warehouse writes", writes.length, [`${rows} rows inserted`, `${(rows / writes.length).toFixed(1)} rows per write`]);
    }

    let order = "";
    if (mail.length) {
      const oneCard = new Set(mail.map((e) => e.cardId)).size === 1 && perRecipient.size > 1;
      const seen = new Map();
      const chips = mail.map((e, i) => {
        const who = esc(oneCard ? String(e.meta?.to).split("@")[0] : e.cardId);
        if (!e.ok) return `<span class="hp-chip" data-tone="danger">✕ ${who}</span>`;
        const n = (seen.get(e.meta?.to) ?? 0) + 1;
        seen.set(e.meta?.to, n);
        return n > 1 ? `<span class="hp-chip" data-tone="danger">${i + 1} ${who} ×${n}</span>` : `<span class="hp-chip" data-tone="neutral">${i + 1} ${who}</span>`;
      });
      order = `<div class="hp-stat"><span class="hp-stat__label">Delivery order</span></div><div class="wall__chips">${chips.join("")}</div>`;
    }
    return { body: `<div class="wall__stack"><div class="wall__grid">${panels.join("")}</div>${order}</div>`, verdict: `${plural(E.length, "call")} recorded` };
  }

  const DAYS = {
    2: { title: "A hopeless card keeps retrying", sub: "Moderation rejects the Grinch card, and the LLM says 429 once.", before: "pnpm send 02 grinch-before", after: "pnpm send 02 grinch", view: day02 },
    3: { title: "The image service wears the card out", sub: "It fails 5 times in a row, one more than the default retries allow.", before: "pnpm send 03 very-flaky-image-before", after: "pnpm send 03 very-flaky-image", view: day03 },
    1: { title: "Retries bill the same card again", sub: "A flaky image service made the whole run start over.", before: "pnpm send 01 flaky-image-before", after: "pnpm send 01 flaky-image", view: day01 },
    6: { title: "One customer blocks everyone", sub: "Account a sent 20 cards, then Maisie sent one.", before: "pnpm send 06 noisy-neighbor-before", after: "pnpm send 06 noisy-neighbor", view: day06 },
    7: { title: "The image service says slow down", sub: "15 cards at once, and it allows 5 renders per 10 seconds.", before: "pnpm send 07 burst-before", after: "pnpm send 07 burst", view: day07 },
    8: { title: "Every keystroke gets billed", sub: "Eight edits in about two seconds, all to one card message.", before: "pnpm send 08 typing-burst-before", after: "pnpm send 08 typing-burst", view: day08 },
    9: { title: "One failure sends to everyone again", sub: "50 recipients, and delivery 25 fails once.", before: "pnpm send 09 bulk-50-before", after: "pnpm send 09 bulk-50", view: day09 },
    11: { title: "120 writes that could be three", sub: "120 card opens in two seconds, and the warehouse bills per write.", before: "pnpm send 11 opens-120-before", after: "pnpm send 11 opens-120", view: day11 },
  };

  // Auto mode follows the run that started most recently: the side of the newest card/side pair
// seen. Retries trickling in from an older run (Day 07 backoff) never flip the view.
const state = { day: 0, config: null, mode: "auto", auto: "before", seen: new Set(), ledger: [], sig: "", sent: 0, edits: { before: { n: 0, at: 0 }, after: { n: 0, at: 0 } } };

  const sides = (ledger) => ({ before: ledger.filter(isBefore), after: ledger.filter((e) => !isBefore(e)) });
  function shownSides(ledger) {
    if (state.mode === "both") return ["before", "after"];
    if (state.mode !== "auto") return [state.mode];
    return [state.auto];
  }

  function render() {
    const { before, after } = sides(state.ledger);
    const data = { before, after };
    const day = DAYS[state.day];
    const view = day?.view ?? generic;
    const shown = shownSides(state.ledger);
    const nn = String(state.day).padStart(2, "0");

    const cols = shown.map((side) => {
      const out = view(data[side], side, data[side === "before" ? "after" : "before"]);
      const hint = day ? day[side] : state.day ? `pnpm send ${nn} <scenario>${side === "before" ? "-before" : ""}` : "";
      const tone = side === "before" ? "danger" : "good";
      return (
        `<section class="hp-ba__col" data-tone="${tone}"><div class="hp-ba__tag">${side}<span>${side === "before" ? "without the fix" : "with the fix"}</span></div>` +
        `<div class="hp-ba__body">${out ? out.body : empty(hint)}</div>` +
        `<div class="hp-ba__verdict">${out ? esc(out.verdict) : "No run yet"}</div></section>`
      );
    });
    document.getElementById("stage").innerHTML = cols.join("");

    // The header verdict follows what is on screen; with both sides shown it stays neutral.
    const verdict = shown.length === 2 ? badge("neutral", "waiting", "Before and after")
      : shown[0] === "before" ? badge("danger", "failed", "Broken") : badge("good", "sent", "Fixed");
    document.getElementById("day").querySelector(".hp-day__verdict").innerHTML = verdict;

    const pressed = shown.length === 2 ? "both" : shown[0];
    for (const b of document.querySelectorAll("#sides button")) b.setAttribute("aria-pressed", String(b.dataset.mode === pressed));
  }

  function renderHeader(config) {
    const level = LEVELS.find((l) => state.day <= l.upTo) ?? LEVELS[0];
    const day = DAYS[state.day];
    const title = day?.title ?? config.title.replace(/^Day \d+[a-z]?:\s*/i, "");
    const header = document.getElementById("day");
    header.className = `hp-day ${level.cls}`;
    header.innerHTML =
      `<div class="hp-day__level"><span class="hp-day__num">${state.day ? String(state.day).padStart(2, "0") : "·"}</span><span class="hp-day__name">${level.name}</span></div>` +
      `<div class="hp-day__main"><h1 class="hp-day__title">${esc(title)}</h1>${day ? `<p class="hp-day__sub">${esc(day.sub)}</p>` : ""}</div>` +
      `<div class="hp-day__verdict"></div>`;
    document.title = `Hearth Post · ${config.title}`;
  }

  function renderBar(config) {
    const seg = document.getElementById("sides");
    seg.innerHTML =
      `<button type="button" data-mode="before" data-tone="danger" aria-pressed="false">Before</button>` +
      `<button type="button" data-mode="after" data-tone="good" aria-pressed="false">After</button>` +
      `<button type="button" data-mode="both" aria-pressed="false">Side by side</button>`;
    seg.onclick = (ev) => {
      const mode = ev.target.dataset?.mode;
      if (!mode) return;
      state.mode = mode;
      render();
    };
    const bar = document.getElementById("bar");
    const anchor = document.querySelector("#sides").nextSibling;
    config.actions.forEach((action, i) => {
      if (action.kind === "button") {
        const button = document.createElement("button");
        button.type = "button";
        button.className = i === 0 ? "hp-btn" : "hp-btn hp-btn--secondary";
        button.textContent = action.label;
        button.onclick = () => sendEvent(action.event, action.data);
        bar.insertBefore(button, anchor);
      } else {
        const field = document.createElement("div");
        field.className = "hp-field";
        const id = `field-${i}`;
        field.innerHTML = `<label for="${id}">${esc(action.label)}</label><input class="hp-input" id="${id}" placeholder="Start typing…" autocomplete="off" />`;
        field.querySelector("input").oninput = (ev) => sendEvent(action.event, { ...action.data, [action.field]: ev.target.value }, true);
        bar.insertBefore(field, anchor);
      }
    });
  }

  // The ledger can't see keystrokes that are still waiting out a debounce, so the page counts the ones it sends.
  function noteEdit(name) {
    const side = name.endsWith(".before") ? "before" : "after";
    state.edits[side] = { n: state.edits[side].n + 1, at: Date.now() };
    state.auto = side;
  }

  async function sendEvent(name, data, typed = false) {
    if (typed) {
      noteEdit(name);
      render();
    }
    await fetch("/__event", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, data }) });
    state.sent++;
    document.getElementById("sent").textContent = `${state.sent} event${state.sent === 1 ? "" : "s"} sent`;
  }

  async function loadConfig() {
    const config = await (await fetch("/__wall")).json();
    state.day = Number(config.appId.replace(/\D/g, "")) || 0;
    state.config = config;
    renderHeader(config);
    renderBar(config);
    render();
  }

  async function poll() {
    try {
      const ledger = await (await fetch("/__ledger")).json();
      const last = ledger[ledger.length - 1];
      const sig = `${ledger.length}:${last?.at ?? 0}`;
      if (sig !== state.sig && state.config) {
        state.sig = sig;
        state.ledger = ledger;
        for (const e of ledger) {
          const side = isBefore(e) ? "before" : "after";
          const key = `${side}:${e.cardId}`;
          if (!state.seen.has(key)) {
            state.seen.add(key);
            state.auto = side;
          }
        }
        render();
      }
    } catch {}
    setTimeout(poll, 500);
  }

  document.getElementById("reset").onclick = async () => {
    await fetch("/__ledger", { method: "DELETE" });
    state.sent = 0;
    state.mode = "auto";
    state.ledger = [];
    state.sig = "";
    state.edits = { before: { n: 0, at: 0 }, after: { n: 0, at: 0 } };
    document.getElementById("sent").textContent = "";
    render();
  };

  const scheme = window.matchMedia("(prefers-color-scheme: dark)");
  const applyScheme = () => (document.documentElement.dataset.theme = scheme.matches ? "dark" : "light");
  applyScheme();
  scheme.addEventListener("change", applyScheme);

  loadConfig().then(poll);
</script>
</body>
</html>
