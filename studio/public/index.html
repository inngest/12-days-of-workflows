<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Holiday Card Studio</title>
    <link rel="stylesheet" href="/ui/tokens.css">
    <link rel="stylesheet" href="/ui/components.css">
    <link rel="stylesheet" href="/studio.css">
  </head>
  <body>
    <header class="masthead">
      <div class="string-lights" aria-hidden="true"><span class="bulb"><b>J</b></span><span class="bulb"><b>A</b></span><span class="bulb"><b>S</b></span><span class="bulb"><b>O</b></span><span class="bulb"><b>N</b></span><span class="bulb"><b>S</b></span><span class="bulb"><b>C</b></span><span class="bulb"><b>A</b></span><span class="bulb"><b>R</b></span><span class="bulb"><b>D</b></span><span class="bulb"><b>S</b></span></div>
      <div class="masthead-inner">
        <div class="brand">Holiday Card Studio<small id="day-line">Every card, durably delivered</small></div>
        <div class="masthead-side">
          <nav id="days" class="studio-days" aria-label="Days that are running"></nav>
          <span id="day-stamp" class="stamp lime" hidden></span>
          <p id="switch-note" class="masthead-note" hidden></p>
          <button id="dev-open" type="button" class="text-button" aria-haspopup="dialog">Dev Server</button>
          <div id="switch" class="switch" hidden>
            <button type="button" class="switch-option" data-side="problem" aria-pressed="true">The problem</button>
            <button type="button" class="switch-option" data-side="fix" aria-pressed="false">The fix</button>
          </div>
        </div>
      </div>
    </header>

    <div class="dashboard-page stack">
      <p id="notice" class="lede" hidden></p>

      <div id="stage" class="stack" hidden>
        <div class="dashboard">
          <form id="send" class="send-card stack"></form>

          <section class="stack" aria-live="polite">
            <div class="live-head">
              <h2>Your card, live</h2>
              <span id="stamp" class="stamp coral" hidden></span>
            </div>
            <p id="progress" class="muted" hidden></p>
            <ol id="feed" class="status-feed"></ol>
            <div id="card"></div>
          </section>

          <section id="trace" class="stack"></section>
        </div>

        <div id="statusbar" class="statusbar" role="status"></div>
        <div id="compare" class="compare strip" hidden></div>

        <section id="drawer" class="card stack presenter" hidden>
          <h2>Presenter</h2>
          <div id="scenarios" class="row"></div>
          <p id="scenario-note" class="muted"></p>
          <div class="row">
            <button id="run" class="button" type="button">Run scenario</button>
            <button id="clear" class="button quiet" type="button">Clear</button>
          </div>
        </section>
      </div>
    </div>
    <div id="devpanel" class="devpanel" role="dialog" aria-modal="true" aria-label="Inngest Dev Server" hidden>
      <header class="devpanel-bar">
        <h2>Inngest Dev Server</h2>
        <button id="dev-current" type="button" class="text-button" hidden>Show current run</button>
        <a id="dev-tab" class="text-button" href="http://localhost:8288/runs" target="_blank" rel="noopener">Open in a new tab</a>
        <button id="dev-close" type="button" class="text-button">Close (Esc)</button>
      </header>
      <p id="dev-down" class="devpanel-note" hidden>The Dev Server is not answering on :8288. Restart the day with: pnpm day NN</p>
      <iframe id="dev-frame" title="Inngest Dev Server"></iframe>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
